	<text x="560" y="272" font-size="21" font-weight="600" fill="#9A3412" text-anchor="middle">社内合意形成</text>
	<text x="665" y="462" font-size="19" font-weight="500" fill="#1e40af" text-anchor="middle">契約</text>
	<text x="770" y="272" font-size="21" font-weight="500" fill="#14563F" text-anchor="middle">立ち上げ</text>
	<text x="910" y="272" font-size="21" font-weight="500" fill="#14563F" text-anchor="middle">成果</text>
	<text x="1057" y="272" font-size="21" font-weight="500" fill="#14563F" text-anchor="middle">拡大</text>

	<polygon points="70,305 212,323 212,477 70,495" fill="#E4EAF5" stroke="#B9C6E0" stroke-width="1.5"/>
	<polygon points="212,323 355,342 355,458 212,477" fill="#E4EAF5" stroke="#B9C6E0" stroke-width="1.5"/>
