name: Deploy to CORESERVER

on:
  push:
    branches:
      - main
  # Actions画面から手動でも実行できるようにする
  workflow_dispatch:

jobs:
  # 本体サイト consilegy.com
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via SSH
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          SOURCE: "dist/"
          TARGET: "public_html/"
          ARGS: "-avz --delete"

  # メディアサイト media.consilegy.com
  # media/ 配下に変更があったときだけ動く
  deploy-media:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check for media changes
        id: changes
        run: |
          # 手動実行のときは常にデプロイする
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD | grep -q '^media/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "media/ に変更がないためスキップします"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # アイキャッチ自動生成（sharp）が日本語を描画するために必要
      - name: Install Japanese fonts
        if: steps.changes.outputs.changed == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        working-directory: media
        # lockfileがあれば npm ci、なければ npm install で通す
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        working-directory: media
        # GTMコンテナID。リポジトリの Settings → Secrets and variables → Actions →
        # Variables に PUBLIC_GTM_ID を登録する（Secretsではなく Variables でよい。
        # コンテナIDは公開情報で、HTMLに出るため）。
        # 未設定なら計測タグは出力されない。
        env:
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
        run: npm run build

      - name: Deploy via SSH
        if: steps.changes.outputs.changed == 'true'
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          SOURCE: "media/dist/"
          TARGET: ${{ secrets.MEDIA_REMOTE_TARGET }}
          ARGS: "-avz --delete"
