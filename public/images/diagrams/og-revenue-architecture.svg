	<text x="70" y="552" font-size="20" fill="#44403C">選定と契約の間に、社内合意形成が独立した工程として入る</text>
	<text x="70" y="586" font-size="17" fill="#78716C">承認2段階以上が8割超／検討期間3〜8か月が63.6%（IDEATECH × 北川裕康氏 2026年4月公表、n=307）</text>

	<text x="1130" y="586" font-size="18" font-weight="500" fill="#1e40af" text-anchor="end">consilegy.com</text>
