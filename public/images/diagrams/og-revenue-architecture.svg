	<polygon points="497,360 640,378 640,422 497,440" fill="#FBE8DC" stroke="#C2410C" stroke-width="2.5"/>

	<rect x="640" y="378" width="50" height="44" fill="#1e40af"/>

	<polygon points="690,378 836,354 836,446 690,422" fill="#E2EFEA" stroke="#A8CBBD" stroke-width="1.5"/>
	<polygon points="836,354 983,329 983,471 836,446" fill="#E2EFEA" stroke="#A8CBBD" stroke-width="1.5"/>
	<polygon points="983,329 1130,305 1130,495 983,471" fill="#E2EFEA" stroke="#A8CBBD" stroke-width="1.5"/>

